<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaMaster - İngilizce Kelime Uygulaması</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 480px;
            margin: 20px;
        }
        h1 { color: #4f46e5; margin-bottom: 8px; }
        p { color: #64748b; line-height: 1.6; }
        .btn-group { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #4338ca; }
        .btn-secondary { background: #f1f5f9; color: #475569; }
        .btn-secondary:hover { background: #e2e8f0; }
        .footer { margin-top: 30px; font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>LinguaMaster</h1>
        <p>İngilizce Kelime Öğrenme ve Ezberleme Uygulaması</p>
        
        <div class="btn-group">
            <a href="https://play.google.com/store/apps/details?id=com.linguamaster.ingilizcekelime" target="_blank" class="btn btn-primary">
                Google Play'de Görüntüle
            </a>
            <a href="privacy-policy.html" class="btn btn-secondary">
                Gizlilik Politikası (Privacy Policy)
            </a>
        </div>

        <div class="footer">
            &copy; 2026 Yusuf Dartan - Tüm hakları saklıdır.
        </div>
    </div>
</body>
</html>
